name: Revisar Capacidad Instalada AMM

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Revisar archivo de la AMM
        id: check
        run: python scripts/check_capacidad.py

      - name: Commitear archivo actualizado
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "AMM: nueva version de Capacidad_Instalada_2026.xls"
          git push

      - name: Crear aviso (issue) si hubo cambios
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Nuevo archivo de Capacidad Instalada AMM" --body "Se detecto un cambio en https://www.amm.org.gt/pdfs2/2026/Capacidad_Instalada_2026.xls. Se actualizo data/Capacidad_Instalada_2026.xls en el repositorio. Descargalo y subelo a Claude para actualizar el Excel con las graficas."
