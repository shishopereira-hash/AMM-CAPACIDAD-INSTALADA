name: Revisar Capacidad Instalada AMM

# Revisa si la AMM publicó una versión nueva del archivo de Capacidad Instalada y avisa en Slack.
# El horario lo da cron-job.org (9 AM, 1 PM y 5 PM de Guatemala); el de GitHub queda como respaldo.
on:
  schedule:
    - cron: "0 23 * * *"     # respaldo: 5:00 PM Guatemala
  workflow_dispatch:
    inputs:
      prueba:
        description: "Escribe 'si' para mandar un mensaje de prueba al canal de Slack"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: capacidad
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Revisar archivo de la AMM y avisar en Slack
        id: check
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0CCR4Y0VEU     # canal #capacidad-instalada
        run: |
          if [ "${{ github.event.inputs.prueba }}" = "si" ]; then
            python scripts/check_capacidad.py --prueba
          else
            python scripts/check_capacidad.py
          fi

      - name: Guardar archivo actualizado
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git commit -m "AMM: nueva versión del archivo de Capacidad Instalada"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
